name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-linux:
    name: Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: x86_64
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          targets: ${{ matrix.target }}
      - name: Verify release version
        run: |
          version=$(awk '/^version = / {gsub(/"/, "", $3); print $3; exit}' Cargo.toml)
          test "$GITHUB_REF_NAME" = "v$version"
      # Release artifacts deliberately use uncached compiler output.
      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }} --bin claude-codex-server
      - name: Package and smoke test
        run: |
          target/${{ matrix.target }}/release/claude-codex-server --version
          scripts/package-release.sh "${GITHUB_REF_NAME#v}" "${{ matrix.target }}" linux "${{ matrix.arch }}"
      - uses: actions/upload-artifact@v7
        with:
          name: claudex-linux-${{ matrix.arch }}
          path: |
            target/release-assets/*.tar.gz
            target/release-assets/*.sha256
          if-no-files-found: error

  publish:
    needs: build-linux
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Verify downloaded checksums
        working-directory: artifacts
        run: sha256sum --check *.sha256
      - name: Publish Linux release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "Claudex $GITHUB_REF_NAME" artifacts/*

name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: clippy, rustfmt
      - name: Set up Boxington
        uses: jdx/mr-boxington-action@a20e1ffcd962370fb2b6045c13b7b349f7b03386
        with:
          version: 1.11.0
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: mbx clippy --all-targets --locked --features test-backend -- -D warnings
      - name: Test
        run: mbx test --locked --all-targets --features test-backend
